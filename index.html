<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamelan in Pop Culture — Guess Where It's From!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f0e3; --ink: #1d1a16;
    --a: #e4572e; --b: #2e86ab; --c: #f2b134; --d: #4f9d69;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Inter', sans-serif; color: var(--ink); background: var(--paper); user-select: none; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4vh 4vw; text-align: center;
    opacity: 0; visibility: hidden; transform: translateY(3vh);
    transition: opacity .45s var(--ease), transform .45s var(--ease), visibility 0s .45s;
  }
  .screen.active { opacity: 1; visibility: visible; transform: none; transition: opacity .45s var(--ease), transform .45s var(--ease), visibility 0s; }
  .screen.leaving { opacity: 0; transform: translateY(-3vh); }

  h1 { font-family: 'Fraunces', serif; font-weight: 900; font-size: 7.5vw; line-height: 1; }
  h1 em { font-style: normal; background: var(--c); padding: 0 .15em; border: .4vh solid var(--ink); }
  .sub { font-size: 2.2vw; margin-top: 3vh; font-weight: 600; }

  .gong {
    width: 20vh; height: 20vh; border-radius: 50%; margin-bottom: 4vh; cursor: pointer;
    background: var(--c); border: .6vh solid var(--ink); box-shadow: .8vh .8vh 0 var(--ink);
    display: grid; place-items: center; transition: transform .15s;
  }
  .gong::after { content: ""; width: 35%; height: 35%; border-radius: 50%; background: var(--ink); opacity: .85; }
  .gong:hover { transform: translate(-.3vh, -.3vh); }
  .gong.hit { animation: wobble .5s ease-out; }
  @keyframes wobble { 20% { transform: rotate(-10deg); } 40% { transform: rotate(7deg); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(2deg); } }
  .ripple { position: fixed; border: .5vh solid var(--ink); border-radius: 50%; pointer-events: none; z-index: 20; animation: ripple 1s ease-out forwards; }
  @keyframes ripple { from { width: 0; height: 0; opacity: .6; } to { width: 70vh; height: 70vh; opacity: 0; } }

  .bigbtn {
    margin-top: 4vh; padding: 1.8vh 4vw; border-radius: 1.2vh; font-size: 2.4vw; font-weight: 800;
    background: var(--a); color: #fff; border: .5vh solid var(--ink); box-shadow: .8vh .8vh 0 var(--ink); transition: transform .1s, box-shadow .1s;
  }
  .bigbtn:hover { transform: translate(-.2vh, -.2vh); box-shadow: 1vh 1vh 0 var(--ink); }
  .bigbtn:active { transform: translate(.8vh, .8vh); box-shadow: 0 0 0 var(--ink); }

  .progress { position: fixed; top: 3vh; left: 50%; transform: translateX(-50%); display: flex; gap: 1vw; z-index: 3; transition: opacity .4s; }
  .progress span { width: 2.6vh; height: 2.6vh; border-radius: 50%; border: .4vh solid var(--ink); transition: all .4s var(--ease); }
  .progress span.done { background: var(--ink); }
  .progress span.now { background: var(--c); transform: scale(1.3); }

  .top { display: flex; align-items: center; gap: 2.5vw; margin-bottom: 3vh; }
  .qtext { font-family: 'Fraunces', serif; font-size: 4vw; }
  .playbtn {
    width: 10vh; height: 10vh; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 4vh;
    display: grid; place-items: center; transition: transform .15s;
  }
  .playbtn:hover { transform: scale(1.08); }
  .wave { display: flex; gap: .5vw; height: 6vh; align-items: center; }
  .wave span { width: .7vw; height: 15%; background: var(--ink); border-radius: 1vw; transition: height .3s; }
  .wave.playing span { animation: bounce .6s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { height: 15%; } 50% { height: 100%; } }

  .options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.8vw; width: 92vw; }
  .opt {
    position: relative; border-radius: 1.6vh; overflow: hidden; text-align: left; cursor: pointer; background: #fff;
    border: .5vh solid var(--ink); box-shadow: .9vh .9vh 0 var(--ink);
    opacity: 0; transform: translateY(5vh);
    transition: transform .4s var(--ease), opacity .4s var(--ease), box-shadow .15s, filter .4s;
  }
  .opt.in { opacity: 1; transform: none; }
  .opt.in:hover { transform: translate(-.4vh, -.6vh); box-shadow: 1.3vh 1.5vh 0 var(--ink); }
  .opt .pic { height: 34vh; display: grid; place-items: center; font-size: 12vh; position: relative; border-bottom: .5vh solid var(--ink); background: #eee4d1; }
  .opt .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .opt .label { display: flex; align-items: center; gap: 1vw; padding: 1.8vh 1.2vw; font-size: 1.8vw; font-weight: 800; min-height: 11vh; }
  .opt .letter { flex: none; width: 5vh; height: 5vh; border-radius: .8vh; display: grid; place-items: center; font-size: 2.8vh; color: #fff; border: .4vh solid var(--ink); }
  .opt:nth-child(1) .letter { background: var(--a); }
  .opt:nth-child(2) .letter { background: var(--b); }
  .opt:nth-child(3) .letter { background: var(--c); color: var(--ink); }
  .opt:nth-child(4) .letter { background: var(--d); }
  .opt.out { opacity: .25 !important; transform: scale(.95) !important; filter: grayscale(1); box-shadow: none; }
  .opt.win { transform: translate(-.6vh, -1.2vh) scale(1.05) !important; box-shadow: 1.4vh 1.6vh 0 var(--ink); background: var(--c); z-index: 2; }
  .opt.nope { animation: nope .4s; }
  @keyframes nope { 20%,60% { transform: translateX(-1.2vw) rotate(-1.5deg); } 40%,80% { transform: translateX(1.2vw) rotate(1.5deg); } }
  .stamp {
    position: absolute; top: 1.5vh; right: 1vw; z-index: 2; padding: .6vh 1vw; border-radius: .8vh; font-weight: 900; font-size: 2.2vh;
    background: #fff; border: .4vh solid var(--ink); transform: scale(0) rotate(-12deg); transition: transform .35s var(--ease);
  }
  .opt.win .stamp, .opt.nope .stamp { transform: scale(1) rotate(-6deg); }

  .fact {
    margin-top: 3.5vh; font-size: 2vw; font-weight: 600; max-width: 80vw; padding: 1.5vh 2vw;
    background: #fff; border: .4vh solid var(--ink); border-radius: 1.2vh;
    opacity: 0; transform: translateY(2vh); transition: all .5s var(--ease);
  }
  .fact.show { opacity: 1; transform: none; }

  .bar { position: fixed; bottom: 2vh; left: 50%; transform: translateX(-50%); display: flex; gap: .6vw; z-index: 4; opacity: .3; transition: opacity .25s; }
  .bar:hover { opacity: 1; }
  .bar button { padding: 1vh 1.4vw; border-radius: 1vh; background: #fff; border: .3vh solid var(--ink); font-size: 1.2vw; font-weight: 700; }
  .bar button:hover { background: var(--c); }

  .countdown { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .25s; background: rgba(247,240,227,.7); }
  .countdown.show { opacity: 1; }
  .countdown div { font-family: 'Fraunces', serif; font-size: 34vh; font-weight: 900; color: var(--ink); }
  .countdown div.pop { animation: pop .8s var(--ease); }
  @keyframes pop { from { transform: scale(1.6); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); } }

  .troll { position: fixed; inset: 0; display: grid; place-items: center; z-index: 10; background: rgba(29,26,22,.85); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
  .troll.show { opacity: 1; visibility: visible; transition: opacity .25s; }
  .troll h2 { font-family: 'Fraunces', serif; font-size: 6.5vw; color: var(--paper); background: var(--a); padding: 2vh 3vw; border: .6vh solid var(--paper); transform: scale(.6) rotate(-4deg); transition: transform .4s var(--ease); }
  .troll.show h2 { transform: scale(1) rotate(-3deg); }
  body.shake { animation: shake .08s linear 8; }
  @keyframes shake { 25%{transform:translate(-1.2vw,1vh)} 50%{transform:translate(1.2vw,-1vh)} 75%{transform:translate(-1vw,-1vh)} }
  .rain { position: fixed; top: -10vh; font-size: 7vh; z-index: 11; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(125vh) rotate(400deg); } }

  .confetti { position: fixed; width: 1.4vh; height: 2.2vh; z-index: 12; pointer-events: none; border: .2vh solid var(--ink); animation: burst 1.6s cubic-bezier(.2,.6,.4,1) forwards; }
  @keyframes burst { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

  .toast { position: fixed; top: 9vh; left: 50%; transform: translate(-50%, -3vh); background: #fff; border: .4vh solid var(--ink); padding: 1.2vh 2vw; border-radius: 1vh; font-size: 1.4vw; font-weight: 700; opacity: 0; transition: all .35s; z-index: 30; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .saron { display: flex; gap: 1vw; margin-top: 4vh; }
  .saron button { width: 7vw; height: 16vh; border-radius: 1vh; background: var(--c); color: var(--ink); font-weight: 900; font-size: 2vw; border: .5vh solid var(--ink); box-shadow: 0 .9vh 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  .saron button:active, .saron button.hit { transform: translateY(.9vh); box-shadow: 0 0 0 var(--ink); }
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<!-- TITLE -->
<section class="screen active" id="title">
  <div class="gong" id="titleGong" title="Hit me!"></div>
  <h1>Gamelan in<br><em>Pop Culture</em></h1>
  <p class="sub">Listen. Guess where it's from.</p>
  <button class="bigbtn" id="startBtn">Start</button>
</section>

<!-- QUESTION -->
<section class="screen" id="question">
  <div class="top">
    <button class="playbtn" id="playBtn" title="Play clip">▶</button>
    <div class="qtext" id="qtext">Where is this sound from?</div>
    <div class="wave" id="wave"></div>
  </div>
  <div class="options" id="options"></div>
  <div class="fact" id="fact"></div>
</section>

<!-- FINALE -->
<section class="screen" id="finale">
  <div class="gong" id="finaleGong"></div>
  <h1>Now hear it<br><em>live</em></h1>
  <p class="sub">Try the saron while we set up (keys 1–5)</p>
  <div class="saron" id="saron"></div>
  <button class="bigbtn" id="againBtn">Play again</button>
</section>

<div class="bar" id="bar">
  <button data-act="back">←</button>
  <button data-act="play">Play</button>
  <button data-act="count">Countdown</button>
  <button data-act="reveal">Reveal</button>
  <button data-act="troll">Troll</button>
  <button data-act="gong">Gong</button>
  <button data-act="next">→</button>
  <button data-act="full">Fullscreen</button>
</div>

<div class="countdown" id="countdown"><div id="cdNum">10</div></div>
<div class="troll" id="troll"><h2 id="trollText">Really? 💀</h2></div>
<div class="toast" id="toast"></div>

<audio id="clip" preload="auto"></audio>

<script>
// ===================== EDIT QUESTIONS HERE =====================
// clip:   audio file in /clips
// img:    picture in /images (optional — if missing, the emoji shows instead)
// answer: index of the correct option (0 = A, 1 = B, 2 = C, 3 = D)
// troll:  index of the troll option
const QUESTIONS = [
  {
    clip: "clips/akira.mp3",
    options: [
      { label: "Ghost in the Shell", img: "images/cowboyintheshell.gif", emoji: "🤖" },
      { label: "Akira",              img: "images/akira.gif",              emoji: "🏍️" },
      { label: "Cowboy Bebop",       img: "images/cowboybepbop.gif",       emoji: "🚀" },
      { label: "Your rice cooker when the rice is done", img: "images/rice-cooker.svg", emoji: "🍚" }
    ],
    answer: 1, troll: 3,
    fact: "Gamelan plays as Tetsuo's psychic powers awaken — performed by Geinoh Yamashirogumi."
  },
  {
    clip: "clips/zelda.mp3",
    options: [
      { label: "Zelda: Echoes of Wisdom", img: "images/zelda.svg",     emoji: "🧝" },
      { label: "Kirby",                   img: "images/kirby.svg",     emoji: "🌸" },
      { label: "Minecraft",               img: "images/minecraft.svg", emoji: "⛏️" },
      { label: "Your alarm on a Monday",  img: "images/alarm.svg",     emoji: "⏰" }
    ],
    answer: 0, troll: 3,
    fact: "In the Faron region, gamelan is the music of the Deku Scrubs."
  },
  {
    clip: "clips/spirited-away.mp3",
    options: [
      { label: "My Neighbor Totoro",  img: "images/totoro.svg",        emoji: "🌳" },
      { label: "Spirited Away",       img: "images/spirited-away.svg", emoji: "🐉" },
      { label: "Princess Mononoke",   img: "images/mononoke.svg",      emoji: "🐺" },
      { label: "Indomie cooking at 3 AM", img: "images/indomie.svg",   emoji: "🍜" }
    ],
    answer: 1, troll: 3,
    fact: "Studio Ghibli, 2001 — listen for the metallic, bell-like tones."
  },
  {
    clip: "clips/mario.mp3",
    options: [
      { label: "Super Mario Odyssey", img: "images/mario.svg",          emoji: "🍄" },
      { label: "Animal Crossing",     img: "images/animal-crossing.svg", emoji: "🍃" },
      { label: "Pokémon",             img: "images/pokemon.svg",        emoji: "⚡" },
      { label: "The Diag squirrels forming a band", img: "images/squirrels.svg", emoji: "🐿️" }
    ],
    answer: 0, troll: 3,
    fact: "The Lost Kingdom jungle level — Nintendo loves gamelan for jungle worlds."
  }
];
const TROLL_LINES = ["Really? 💀", "Be serious.", "Nice try 🤡", "Absolutely not."];
// ===============================================================

const $ = id => document.getElementById(id);
const clip = $("clip");
let idx = -1, revealed = false, cdTimer = null, busy = false;

// ---------- setup ----------
for (let i = 0; i < 18; i++) $("wave").appendChild(Object.assign(document.createElement("span"), { style: `animation-delay:${(i % 5) * .1}s` }));
QUESTIONS.forEach(() => $("progress").appendChild(document.createElement("span")));
const SARON = [[1, 294], [2, 330], [3, 370], [5, 440], [6, 494]]; // pelog-ish notes
SARON.forEach(([n, f], i) => {
  const b = document.createElement("button"); b.textContent = n;
  b.onclick = () => { metal(f); b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 120); };
  $("saron").appendChild(b);
});

// ---------- sounds (synthesized, no files needed) ----------
let actx;
const ctx = () => actx || (actx = new (window.AudioContext || window.webkitAudioContext)());
function partials(list, dur, vol) {
  const c = ctx(), t = c.currentTime, out = c.createGain();
  out.gain.setValueAtTime(vol, t); out.gain.exponentialRampToValueAtTime(.001, t + dur); out.connect(c.destination);
  list.forEach(([f, g]) => { const o = c.createOscillator(), gg = c.createGain(); o.frequency.value = f; gg.gain.value = g; o.connect(gg).connect(out); o.start(t); o.stop(t + dur); });
}
function gongSound() { partials([[98, 1], [196, .5], [262, .35], [392, .2], [523, .1]], 4, .8); }
function metal(f) { partials([[f, 1], [f * 2.76, .3], [f * 5.4, .1]], 1.5, .5); }
function blip(f1, f2, dur, type = "triangle", vol = .4) {
  const c = ctx(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
}
const tick = () => blip(200, 70, .15);
const bonk = () => blip(320, 60, .4, "square", .25);
const whoosh = () => blip(120, 900, .35, "sine", .12);

// ---------- effects ----------
function gong(el) {
  gongSound();
  const r = (el || document.querySelector(".screen.active .gong") || document.body).getBoundingClientRect();
  const rp = document.createElement("div"); rp.className = "ripple";
  rp.style.left = r.left + r.width / 2 + "px"; rp.style.top = r.top + r.height / 2 + "px"; rp.style.transform = "translate(-50%,-50%)";
  document.body.appendChild(rp); setTimeout(() => rp.remove(), 1300);
  if (el) { el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); }
}
function confetti(fromEl) {
  const r = fromEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#e4572e", "#2e86ab", "#f2b134", "#4f9d69", "#fff"];
  for (let i = 0; i < 90; i++) {
    const p = document.createElement("div"); p.className = "confetti";
    const a = Math.random() * Math.PI * 2, d = 20 + Math.random() * 50;
    p.style.left = cx + "px"; p.style.top = cy + "px"; p.style.background = colors[i % colors.length];
    p.style.setProperty("--x", Math.cos(a) * d + "vw"); p.style.setProperty("--y", Math.sin(a) * d + 20 + "vh");
    p.style.setProperty("--r", Math.random() * 900 + "deg");
    document.body.appendChild(p); setTimeout(() => p.remove(), 1900);
  }
}
function toast(msg) { $("toast").textContent = msg; $("toast").classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("show"), 3500); }

// ---------- screens ----------
function go(id, after) {
  const cur = document.querySelector(".screen.active");
  whoosh();
  if (cur) { cur.classList.add("leaving"); cur.classList.remove("active"); setTimeout(() => cur.classList.remove("leaving"), 600); }
  setTimeout(() => { $(id).classList.add("active"); after && after(); }, 250);
}
function updateProgress() {
  [...$("progress").children].forEach((s, i) => { s.className = i < idx ? "done" : i === idx ? "now" : ""; });
  $("progress").style.opacity = idx >= 0 && idx < QUESTIONS.length ? 1 : 0;
}

function stopClip() { clip.pause(); $("wave").classList.remove("playing"); $("playBtn").textContent = "▶"; }

function load(newIdx) {
  if (busy) return; busy = true; setTimeout(() => busy = false, 700);
  stopClip(); clearCd(); revealed = false; idx = newIdx; updateProgress();
  if (idx < 0) return go("title");
  if (idx >= QUESTIONS.length) return go("finale", () => { gong($("finaleGong")); confetti($("finaleGong")); });
  const q = QUESTIONS[idx];
  $("qtext").textContent = `Q${idx + 1}: Where is this sound from?`;
  $("fact").textContent = q.fact; $("fact").classList.remove("show");
  $("options").innerHTML = q.options.map((o, i) => `
    <div class="opt" data-i="${i}">
      <div class="pic">${o.emoji}<img src="${o.img}" alt="" onerror="this.remove()"></div>
      <div class="label"><span class="letter">${"ABCD"[i]}</span><span>${o.label}</span></div>
      <div class="stamp">${i === q.answer ? "Correct!" : i === q.troll ? "lol no" : "Nope"}</div>
    </div>`).join("");
  [...document.querySelectorAll(".opt")].forEach(el => el.onclick = () => pick(+el.dataset.i));
  clip.src = q.clip;
  go("question", () => document.querySelectorAll(".opt").forEach((el, i) => setTimeout(() => { el.classList.add("in"); tick(); }, 150 + i * 130)));
}

function togglePlay() {
  if (idx < 0) return load(0);
  if (idx >= QUESTIONS.length) return;
  if (clip.paused) {
    clip.play().then(() => { $("wave").classList.add("playing"); $("playBtn").textContent = "❚❚"; })
      .catch(() => toast(`⚠ Missing audio: ${QUESTIONS[idx].clip} — add it to the clips folder`));
  } else stopClip();
}
clip.addEventListener("ended", stopClip);

// clicking an option
function pick(i) {
  if (revealed) return;
  const q = QUESTIONS[idx], el = document.querySelectorAll(".opt")[i];
  if (i === q.troll) return troll();
  if (i === q.answer) return reveal();
  bonk(); el.classList.remove("nope"); void el.offsetWidth; el.classList.add("nope", "out");
}

function reveal() {
  if (revealed || idx < 0 || idx >= QUESTIONS.length) return;
  revealed = true; stopClip(); clearCd();
  const q = QUESTIONS[idx], opts = [...document.querySelectorAll(".opt")];
  const wrong = opts.map((_, i) => i).filter(i => i !== q.answer && !opts[i].classList.contains("out"));
  wrong.forEach((i, n) => setTimeout(() => { opts[i].classList.add("out"); tick(); }, 450 * (n + 1)));
  setTimeout(() => {
    opts[q.answer].classList.add("win"); gongSound(); confetti(opts[q.answer]); $("fact").classList.add("show");
  }, 450 * (wrong.length + 1) + 200);
}

function troll() {
  if (idx < 0 || idx >= QUESTIONS.length) return;
  bonk(); setTimeout(bonk, 180);
  const t = document.querySelectorAll(".opt")[QUESTIONS[idx].troll];
  if (t && !revealed) { t.classList.add("nope"); setTimeout(() => t.classList.remove("nope"), 400); }
  $("trollText").innerHTML = TROLL_LINES[Math.floor(Math.random() * TROLL_LINES.length)];
  document.body.classList.remove("shake"); void document.body.offsetWidth; document.body.classList.add("shake");
  $("troll").classList.add("show");
  for (let i = 0; i < 20; i++) {
    const s = document.createElement("div"); s.className = "rain"; s.textContent = Math.random() < .5 ? "💀" : "🤡";
    s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = 1.5 + Math.random() * 2 + "s"; s.style.animationDelay = Math.random() * .8 + "s";
    document.body.appendChild(s); setTimeout(() => s.remove(), 4500);
  }
  setTimeout(() => $("troll").classList.remove("show"), 2300);
}

function clearCd() { clearInterval(cdTimer); cdTimer = null; $("countdown").classList.remove("show"); }
function countdown() {
  if (revealed || idx < 0 || idx >= QUESTIONS.length) return;
  if (cdTimer) return clearCd();
  let n = 10;
  const show = () => { const d = $("cdNum"); d.textContent = n; d.classList.remove("pop"); void d.offsetWidth; d.classList.add("pop"); tick(); };
  $("countdown").classList.add("show"); show();
  cdTimer = setInterval(() => { n--; if (n <= 0) { clearCd(); reveal(); } else show(); }, 1000);
}

function fullscreen() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }

// ---------- controls ----------
const ACTIONS = {
  back: () => idx > -1 && load(idx - 1), next: () => idx < QUESTIONS.length && load(idx + 1),
  play: togglePlay, count: countdown, reveal, troll, gong: () => gong(document.querySelector(".screen.active .gong")), full: fullscreen
};
document.querySelectorAll(".bar button").forEach(b => b.onclick = () => ACTIONS[b.dataset.act]());
$("startBtn").onclick = () => { gong($("titleGong")); load(0); };
$("againBtn").onclick = () => load(0);
$("playBtn").onclick = togglePlay;
$("titleGong").onclick = () => gong($("titleGong"));
$("finaleGong").onclick = () => { gong($("finaleGong")); confetti($("finaleGong")); };

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (idx >= QUESTIONS.length && "12345".includes(k) && k) { $("saron").children["12345".indexOf(k)].click(); return; }
  const map = { " ": "play", arrowright: "next", n: "next", arrowleft: "back", b: "back", r: "reveal", t: "troll", c: "count", g: "gong", f: "full" };
  if (map[k]) { e.preventDefault(); ACTIONS[map[k]](); }
});
</script>
</body>
