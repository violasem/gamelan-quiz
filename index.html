<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamelan in Pop Culture — Guess Where It's From!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #140d08;
    --bg2: #2a1a0e;
    --gold: #e8b04a;
    --gold-soft: #f6d58e;
    --cream: #fbf1dd;
    --a: #d94f3d; --b: #3d8bd9; --c: #e8b04a; --d: #4caf6e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    background: radial-gradient(ellipse at center, var(--bg2) 0%, var(--bg) 75%);
    user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 4vh 5vw; text-align: center; }
  .screen.active { display: flex; }

  /* batik-ish border pattern */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(45deg, rgba(232,176,74,.06) 0 2px, transparent 2px 22px),
      repeating-linear-gradient(-45deg, rgba(232,176,74,.06) 0 2px, transparent 2px 22px);
    mask: linear-gradient(#000 0 6vh, transparent 6vh calc(100% - 6vh), #000 calc(100% - 6vh));
  }

  h1 { font-family: 'Fraunces', serif; font-weight: 900; font-size: 8vw; line-height: 1; color: var(--gold); text-shadow: 0 .5vw 0 #6b3f12; }
  .sub { font-size: 2.6vw; margin-top: 3vh; color: var(--gold-soft); }
  .hint { position: fixed; bottom: 2vh; left: 0; right: 0; font-size: 1.2vw; opacity: .45; }

  /* gong */
  .gong { width: 22vh; height: 22vh; border-radius: 50%; margin-bottom: 4vh;
    background: radial-gradient(circle at 50% 50%, #f6d58e 0 12%, #c98a2b 13% 16%, #e8b04a 17% 55%, #a86b1e 56% 60%, #e8b04a 61% 88%, #6b3f12 89%);
    box-shadow: 0 0 6vh rgba(232,176,74,.35); }
  .gong.ring { animation: ring .12s ease-in-out infinite alternate; }
  @keyframes ring { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(3deg) scale(1.04); } }

  /* question */
  .qnum { font-size: 2vw; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  .qtext { font-family: 'Fraunces', serif; font-size: 5vw; margin: 1.5vh 0 3vh; }
  .wave { display: flex; gap: .8vw; height: 10vh; align-items: center; margin-bottom: 3vh; }
  .wave span { width: 1.2vw; height: 20%; background: var(--gold); border-radius: 1vw; transition: height .1s; }
  .wave.playing span { animation: bounce .6s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { height: 20%; } 50% { height: 100%; } }
  .wave span:nth-child(2n) { animation-delay: .1s !important; }
  .wave span:nth-child(3n) { animation-delay: .25s !important; }
  .wave span:nth-child(5n) { animation-delay: .4s !important; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5vh 2vw; width: 90vw; }
  .opt { display: flex; align-items: center; gap: 2vw; padding: 2.6vh 2vw; border-radius: 2vh; font-size: 2.8vw; font-weight: 800; text-align: left; transition: opacity .5s, transform .5s, filter .5s; }
  .opt .letter { flex: none; width: 6vh; height: 6vh; border-radius: 50%; background: rgba(0,0,0,.25); display: grid; place-items: center; font-size: 3.5vh; }
  .opt:nth-child(1) { background: var(--a); }
  .opt:nth-child(2) { background: var(--b); }
  .opt:nth-child(3) { background: var(--c); color: #2a1a0e; }
  .opt:nth-child(4) { background: var(--d); }
  .opt.out { opacity: .12; transform: scale(.94); filter: grayscale(1); }
  .opt.win { transform: scale(1.06); box-shadow: 0 0 0 .6vh var(--cream), 0 0 6vh var(--gold); }

  .countdown { position: fixed; inset: 0; display: none; place-items: center; background: rgba(20,13,8,.75); font-family: 'Fraunces', serif; font-size: 30vh; color: var(--gold); z-index: 5; }
  .countdown.show { display: grid; }

  .fact { margin-top: 3vh; font-size: 2.4vw; color: var(--gold-soft); min-height: 4vw; opacity: 0; transition: opacity .6s; }
  .fact.show { opacity: 1; }

  /* troll */
  .troll { position: fixed; inset: 0; display: none; place-items: center; z-index: 10; background: rgba(0,0,0,.6); }
  .troll.show { display: grid; }
  .troll h2 { font-family: 'Fraunces', serif; font-size: 7vw; color: #fff; text-shadow: 0 0 3vw #d94f3d; }
  body.shake { animation: shake .08s linear 8; }
  @keyframes shake { 0%{transform:translate(0)} 25%{transform:translate(-1.5vw,1vh)} 50%{transform:translate(1.5vw,-1vh)} 75%{transform:translate(-1vw,-1vh)} 100%{transform:translate(0)} }
  .skull { position: fixed; top: -10vh; font-size: 7vh; z-index: 11; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(125vh) rotate(540deg); } }

  .missing { font-size: 1.4vw; color: #ff9b8a; margin-top: 1vh; min-height: 2vw; }
</style>
</head>
<body>

<!-- TITLE -->
<section class="screen active" id="title">
  <div class="gong" id="titleGong"></div>
  <h1>Gamelan in<br>Pop Culture</h1>
  <p class="sub">🎵 Guess where the sound is from!</p>
  <p class="hint">Press SPACE to start · F for fullscreen</p>
</section>

<!-- QUESTION -->
<section class="screen" id="question">
  <div class="qnum" id="qnum">Question 1 / 4</div>
  <div class="qtext">Where is this sound from?</div>
  <div class="wave" id="wave"></div>
  <div class="options" id="options"></div>
  <div class="fact" id="fact"></div>
  <div class="missing" id="missing"></div>
  <p class="hint">SPACE play/pause · C countdown · R reveal · T troll · → next · ← back</p>
</section>

<!-- FINALE -->
<section class="screen" id="finale">
  <div class="gong ring" id="finaleGong"></div>
  <h1>Now hear it<br>LIVE 🔔</h1>
  <p class="sub">Terima kasih! — Permias U-M</p>
</section>

<div class="countdown" id="countdown">10</div>
<div class="troll" id="troll"><h2>💀 BRO REALLY<br>CHOSE THIS 💀</h2></div>

<audio id="clip" preload="auto"></audio>

<script>
// ====== EDIT QUESTIONS HERE ======
// Put audio files in the /clips folder with these names (mp3, or change the extension).
// "answer" is the index of the correct option (0 = A, 1 = B, 2 = C, 3 = D).
// "troll" is the index of the troll option.
const QUESTIONS = [
  {
    clip: "clips/akira.mp3",
    options: ["Ghost in the Shell", "Akira", "Cowboy Bebop", "Your rice cooker when the rice is done 🤡"],
    answer: 1, troll: 3,
    fact: "Gamelan plays as Tetsuo's psychic powers awaken — performed by Geinoh Yamashirogumi."
  },
  {
    clip: "clips/zelda.mp3",
    options: ["Zelda: Echoes of Wisdom", "Kirby", "Minecraft", "Your alarm on a Monday 🤡"],
    answer: 0, troll: 3,
    fact: "In the Faron region, gamelan is the music of the Deku Scrubs."
  },
  {
    clip: "clips/spirited-away.mp3",
    options: ["My Neighbor Totoro", "Spirited Away", "Princess Mononoke", "Indomie cooking at 3 AM 🤡"],
    answer: 1, troll: 3,
    fact: "Studio Ghibli, 2001 — listen for the metallic, bell-like tones."
  },
  {
    clip: "clips/mario.mp3",
    options: ["Super Mario Odyssey", "Animal Crossing", "Pokémon", "The Diag squirrels forming a band 🤡"],
    answer: 0, troll: 3,
    fact: "The Lost Kingdom jungle level — Nintendo loves gamelan for jungle worlds."
  }
];
// =================================

const $ = id => document.getElementById(id);
const clip = $("clip");
let idx = -1;          // -1 = title, QUESTIONS.length = finale
let revealed = false;
let countdownTimer = null;

// sound wave bars
for (let i = 0; i < 24; i++) $("wave").appendChild(document.createElement("span"));

// --- synthesized sounds (no files needed) ---
let actx;
function ctx() { return actx || (actx = new (window.AudioContext || window.webkitAudioContext)()); }
function gong() {
  const c = ctx(), t = c.currentTime, out = c.createGain();
  out.gain.setValueAtTime(0.9, t); out.gain.exponentialRampToValueAtTime(0.001, t + 4);
  out.connect(c.destination);
  [[110, 1], [220, .5], [293, .35], [415, .2], [554, .12]].forEach(([f, g]) => {
    const o = c.createOscillator(), gg = c.createGain();
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * .985, t + 4);
    gg.gain.value = g; o.connect(gg).connect(out); o.start(t); o.stop(t + 4);
  });
}
function tick() {
  const c = ctx(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + .15);
  g.gain.setValueAtTime(.6, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + .2);
}
function bonk() {
  const c = ctx(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = "square"; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(70, t + .4);
  g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + .45);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + .45);
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function stopClip() { clip.pause(); $("wave").classList.remove("playing"); }

function loadQuestion() {
  stopClip(); clearCountdown(); revealed = false;
  if (idx < 0) { show("title"); return; }
  if (idx >= QUESTIONS.length) { show("finale"); gong(); return; }
  const q = QUESTIONS[idx];
  $("qnum").textContent = `Question ${idx + 1} / ${QUESTIONS.length}`;
  $("options").innerHTML = q.options.map((o, i) =>
    `<div class="opt"><span class="letter">${"ABCD"[i]}</span><span>${o}</span></div>`).join("");
  $("fact").textContent = q.fact; $("fact").classList.remove("show");
  $("missing").textContent = "";
  clip.src = q.clip; clip.currentTime = 0;
  show("question");
}

function togglePlay() {
  if (idx < 0 || idx >= QUESTIONS.length) return;
  if (clip.paused) {
    clip.play().then(() => $("wave").classList.add("playing"))
      .catch(() => { $("missing").textContent = `⚠ Couldn't play ${QUESTIONS[idx].clip} — add the file to the clips folder.`; });
  } else stopClip();
}
clip.addEventListener("ended", () => $("wave").classList.remove("playing"));
clip.addEventListener("error", () => { if (idx >= 0 && idx < QUESTIONS.length) $("missing").textContent = `⚠ Missing audio: ${QUESTIONS[idx].clip}`; });

function reveal() {
  if (revealed || idx < 0 || idx >= QUESTIONS.length) return;
  revealed = true; stopClip(); clearCountdown();
  const q = QUESTIONS[idx], opts = [...document.querySelectorAll(".opt")];
  const wrong = opts.map((_, i) => i).filter(i => i !== q.answer);
  wrong.forEach((i, n) => setTimeout(() => { opts[i].classList.add("out"); tick(); }, 700 * (n + 1)));
  setTimeout(() => { opts[q.answer].classList.add("win"); gong(); $("fact").classList.add("show"); }, 700 * (wrong.length + 1) + 300);
}

function troll() {
  if (idx < 0 || idx >= QUESTIONS.length) return;
  bonk();
  document.body.classList.remove("shake"); void document.body.offsetWidth; document.body.classList.add("shake");
  $("troll").classList.add("show");
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("div");
    s.className = "skull"; s.textContent = Math.random() < .8 ? "💀" : "🤡";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 1.5 + Math.random() * 2 + "s";
    s.style.animationDelay = Math.random() * .8 + "s";
    document.body.appendChild(s); setTimeout(() => s.remove(), 4500);
  }
  setTimeout(() => $("troll").classList.remove("show"), 2500);
}

function clearCountdown() { clearInterval(countdownTimer); countdownTimer = null; $("countdown").classList.remove("show"); }
function countdown() {
  if (revealed || idx < 0 || idx >= QUESTIONS.length) return;
  if (countdownTimer) { clearCountdown(); return; }
  let n = 10; $("countdown").textContent = n; $("countdown").classList.add("show"); tick();
  countdownTimer = setInterval(() => {
    n--;
    if (n <= 0) { clearCountdown(); reveal(); return; }
    $("countdown").textContent = n; tick();
  }, 1000);
}

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); if (idx < 0) { idx = 0; gong(); loadQuestion(); } else togglePlay(); }
  else if (k === "arrowright" || k === "n") { if (idx < QUESTIONS.length) { idx++; loadQuestion(); } }
  else if (k === "arrowleft" || k === "b") { if (idx > -1) { idx--; loadQuestion(); } }
  else if (k === "r") reveal();
  else if (k === "t") troll();
  else if (k === "c") countdown();
  else if (k === "g") gong();
  else if (k === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
$("titleGong").addEventListener("click", gong);
</script>
</body>
</html>
